[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "patchiq"
version = "0.1.0"
description = "AI-powered patch review for the KVM and Linux open source stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "IBM KVM & Linux Open Source Team" },
]
keywords = ["kvm", "linux", "kernel", "qemu", "libvirt", "patch", "code-review", "watsonx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "pre-commit>=3.0",
]

[project.scripts]
patchiq = "patchiq.cli:main"

[project.urls]
Repository = "https://github.ibm.com/cheruiyo/Watsonx_challenge_2026"
Issues     = "https://github.ibm.com/cheruiyo/Watsonx_challenge_2026/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["patchiq*"]

# ── ruff (linter + formatter) ──────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # line-length enforced by our own U001 rule

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

# ── coverage ──────────────────────────────────────────────────
[tool.coverage.run]
source = ["patchiq"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
