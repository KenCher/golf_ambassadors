# ─────────────────────────────────────────────────────────────
#  CIIQ — Team Configuration File  (local / no-API edition)
#  Edit once; all team members share it.
#  For the watsonx-backed variant see: config-wx.yaml
# ─────────────────────────────────────────────────────────────

ci:
  # Base log directory on tuxmaker
  log_base: "/home/ciuser/logs/daily"
  # Web UI base URL for CI runs
  webui_base: "https://lnxgwne1.boeblingen.de.ibm.com/linux-ci/webui/ci-run"
  # tuxmaker SSH host (used by the extraction helper script)
  tuxmaker_host: "tuxmaker"
  # tuxmaker SSH user
  tuxmaker_user: ""
  # Kernel git repo path on tuxmaker
  kernel_repo: "/home/ciuser/linux"
  # Local directory for caching fetched git deltas (relative to ciiq dir)
  delta_cache_dir: "delta_cache"

projects:
  kvm:
    suites:
      - { name: "canton-prototype",    category: "kernel",  default_status: "FAIL" }
      - { name: "ci-reipl",            category: "infra",   default_status: "FAIL" }
      - { name: "hades",               category: "kernel",  default_status: "FAIL" }
      - { name: "hades-monolithic",    category: "kernel",  default_status: "PASS" }
      - { name: "hades-withHW",        category: "hw",      default_status: "FAIL" }
      - { name: "kvm-selftests",       category: "test",    default_status: "FAIL" }
      - { name: "kvm-unit-tests-kvm",  category: "test",    default_status: "FAIL" }
      - { name: "s390-tools",          category: "config",  default_status: "PASS" }
  qemu:
    suites:
      - { name: "qemu-s390x-kvm",      category: "kernel",  default_status: "FAIL" }
      - { name: "qemu-migration-s390", category: "config",  default_status: "FAIL" }
      - { name: "qemu-unit-tests",     category: "test",    default_status: "PASS" }
      - { name: "qemu-tcg-s390x",      category: "test",    default_status: "PASS" }
  libvirt:
    suites:
      - { name: "libvirt-s390x",       category: "config",  default_status: "FAIL" }
      - { name: "libvirt-migration",   category: "config",  default_status: "FAIL" }
      - { name: "libvirt-qemu-driver", category: "kernel",  default_status: "FAIL" }
      - { name: "libvirt-unit-tests",  category: "test",    default_status: "PASS" }

server:
  host: "0.0.0.0"
  port: 5100
  debug: false
  # Secret key for Flask session — override with env var CIIQ_SECRET_KEY
  secret_key: "${CIIQ_SECRET_KEY}"
